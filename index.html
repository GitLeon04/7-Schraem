<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="description" content="7-Schräm Life Tracker – Leben, Einsätze und Kontostände im Blick.">
  <title>7‑Schräm Tracker</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="7-Schräm Startseite">
        <span class="brand-mark" aria-hidden="true">7</span>
        <span class="brand-name">SCHRÄM</span>
      </a>
      <span class="topbar-meta label" id="round-label">Runde 01</span>
    </div>
  </header>

  <main class="page">

    <!-- Hero -->
    <section class="hero">
      <span class="label">Life Tracker · v2</span>
      <h1>Sieben Leben.<br><span class="muted">Ein Gewinner.</span></h1>
    </section>

    <!-- 01 · Einsatz -->
    <form id="setup-form" class="panel" novalidate>
      <div class="panel-head">
        <span class="label">01 — Einsatz</span>
      </div>
      <div class="panel-body">
        <label class="field">
          <span class="field-label">Einsatz pro Spieler (€)</span>
          <input type="text" id="global-bet" inputmode="decimal" autocomplete="off" placeholder="2,00">
        </label>
        <div class="row">
          <button type="submit" id="set-bet-button" class="btn btn-primary">Einsatz festlegen <span aria-hidden="true">→</span></button>
          <button type="button" id="cancel-bet-button" class="btn btn-ghost" hidden>Abbrechen</button>
        </div>
      </div>
    </form>

    <div id="game" hidden>

      <!-- Kennzahlen -->
      <section class="stats-wrap">
        <div id="stats" class="stats" aria-live="polite"></div>
        <button type="button" id="edit-bet-button" class="btn btn-ghost btn-small">Einsatz ändern</button>
      </section>

      <!-- 02 · Spieler -->
      <section class="panel">
        <div class="panel-head">
          <span class="label">02 — Spieler</span>
          <button type="button" id="toggle-player-ui" class="btn btn-ghost btn-small" aria-expanded="true" aria-controls="player-ui">
            <span class="toggle-label">Ausblenden</span>
          </button>
        </div>
        <div id="player-ui" class="panel-body">
          <form id="player-form" class="inline-form" novalidate>
            <label class="field grow">
              <span class="field-label">Spielername</span>
              <input type="text" id="player-name" autocomplete="off" placeholder="Name eingeben">
            </label>
            <button type="submit" id="add-player-button" class="btn btn-primary">Hinzufügen <span aria-hidden="true">+</span></button>
          </form>

          <div class="presets">
            <span class="field-label">Vorschläge</span>
            <div class="preset-list">
              <button type="button" class="chip preset-player" data-name="Flaschko">Flaschko</button>
              <button type="button" class="chip preset-player" data-name="Eckmann">Eckmann</button>
              <button type="button" class="chip preset-player" data-name="Ansgar">Ansgar</button>
              <button type="button" class="chip preset-player" data-name="Ilkcross">Ilkcross</button>
              <button type="button" class="chip preset-player" data-name="Tolj">Tolj</button>
              <button type="button" class="chip preset-player" data-name="Titan">Titan</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Gewinner -->
      <section id="winner" class="winner" hidden aria-live="assertive"></section>

      <!-- 03 · Runde -->
      <section class="panel panel-flush">
        <div class="panel-head">
          <span class="label">03 — Spielfeld</span>
        </div>
        <div id="players" class="grid"></div>
      </section>

      <!-- Steuerung -->
      <section class="actions">
        <button type="button" id="restart-button" class="btn" hidden>Nächste Runde <span aria-hidden="true">→</span></button>
        <button type="button" id="reset-button" class="btn btn-danger-ghost" hidden>Alles zurücksetzen</button>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>Rein privates Projekt für den nicht kommerziellen Gebrauch im Freundeskreis.</p>
      <p>Made by Ansgar &amp; Flaschko &amp; Eckmann</p>
      <p id="last-deploy" class="label">Letztes Deployment · lädt …</p>
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Bestätigungsdialog -->
  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <span class="label">Bestätigung</span>
      <h2 id="confirm-title">Sicher?</h2>
      <p id="confirm-text"></p>
      <div class="row row-end">
        <button type="submit" value="cancel" class="btn btn-ghost">Abbrechen</button>
        <button type="submit" value="ok" id="confirm-ok" class="btn btn-primary">Bestätigen</button>
      </div>
    </form>
  </dialog>

  <script src="js/game.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
